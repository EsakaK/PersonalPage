<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图片和文字布局</title>
    <style>
        .container {
            display: flex;
            align-items: center; /* 垂直居中对齐 */
            margin: 20px;
        }
        .container img {
            max-width: 100%; /* 确保图片响应式 */
            height: auto; /* 保持宽高比 */
            margin-right: 20px; /* 图片和文字之间的间距 */
        }
        .text {
            flex: 1; /* 让文字区域占据剩余空间 */
        }
    </style>
</head>
<body>

<div class="container">
    <img src="./images/news/LSSVC.png" alt="描述文字">
    <div class="text">
        <p>这是右侧的文字内容。你可以在这里添加任何你想要的文字。</p>
    </div>
</div>

</body>
</html>
